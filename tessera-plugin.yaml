# Panel camera: the OV02C10 camera of the Guition JC8012P4A1 (first build) as a camera of the screen in Home Assistant.
# The driver is components/p4_csi_camera, a patched copy of sullb/esphome-p4-csi-camera that shares the touch panel's
# I2C bus (touch_bus) with the sensor instead of opening a second controller on GPIO7/GPIO8.
id: panel_camera
version: 0.1.2
api: "0.10"
icon: cctv
maintainer: mjonessa
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.9.0
  psram: true
boards: [jc8012p4a1]
flash_kb: 300
