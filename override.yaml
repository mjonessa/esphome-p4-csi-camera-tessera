# Tessera Override YAML: the panel camera (OV02C10 on the MIPI-CSI port) of a Guition JC8012P4A1, first build.
# Paste into the screen's  ··· → Override YAML, then Save & check and Update firmware.
#
# The camera component is the patched copy in components/p4_csi_camera of this folder: it shares the touch panel's
# I2C bus (touch_bus, GPIO7/GPIO8) instead of opening a second controller on the same pins. Tessera builds the screen
# on your Home Assistant, so the component has to come from a git repository it can reach: this repository.

external_components:
  - source:
      type: git
      url: https://github.com/mjonessa/esphome-p4-csi-camera-tessera.git
      ref: main
    components: [p4_csi_camera]

esp32:
  framework:
    advanced:
      enable_idf_experimental_features: true

p4_csi_camera:
  id: csi_cam
  name: "Panel Camera"
  i2c_id: touch_bus
  data_lanes: 2
  max_framerate: 2 fps
  idle_framerate: 0.1 fps
  jpeg_quality: 40

number:
  - platform: p4_csi_camera
    camera_id: csi_cam
    name: "Camera JPEG Quality"

switch:
  - platform: p4_csi_camera
    camera_id: csi_cam
    vertical_flip:
      name: "Camera Vertical Flip"
    horizontal_flip:
      name: "Camera Horizontal Flip"
